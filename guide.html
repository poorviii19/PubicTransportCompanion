<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Guide</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif
}

body{
  min-height:100vh;
  color:#fff;
  background:#000
}

.bg{
  position:fixed;
  inset:0;
  background:url("/Assets/route-bg.jpg") center/cover no-repeat;
  filter:blur(4px) brightness(0.5);
  z-index:-1
}

.container{
  max-width:900px;
  margin:auto;
  padding:40px 20px
}

h1{
  text-align:center;
  font-size:36px;
  margin-bottom:10px
}

.summary{
  text-align:center;
  font-size:18px;
  opacity:.9
}

.meta{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:25px 0;
  font-size:15px;
  opacity:.9
}

.steps{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  gap:18px
}

.step-card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:16px;
  padding:20px
}

.step-card h3{
  font-size:20px;
  margin-bottom:8px
}

.step-card p{
  font-size:16px;
  opacity:.9
}

.back{
  text-align:center;
  margin-top:35px
}

.back a{
  color:#4cff4c;
  text-decoration:none;
  font-size:18px
}

.back a:hover{
  text-decoration:underline
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<h1 id="title"></h1>
<p class="summary" id="summary"></p>

<div class="meta">
  <span id="traffic"></span>
  <span id="weather"></span>
  <span id="safety"></span>
</div>

<div class="steps" id="steps"></div>

<div class="back">
  <a href="result.html">← Back to Routes</a>
</div>

</div>

<script>
const route = JSON.parse(localStorage.getItem("selectedRoute"));

document.getElementById("title").innerText =
`${route.mode} Route : ${route.from} → ${route.to}`;

document.getElementById("summary").innerText =
`Distance ${route.distance} • Time ${route.time} • Cost ${route.cost}`;

document.getElementById("traffic").innerText = "Traffic: " + route.traffic;
document.getElementById("weather").innerText = "Weather: " + route.weather;
document.getElementById("safety").innerText = "Safety: " + route.safety;

const stepsBox = document.getElementById("steps");
stepsBox.innerHTML = "";

route.steps.forEach((step,i)=>{
  const div = document.createElement("div");
  div.className = "step-card";
  div.innerHTML = `<h3>Step ${i+1}</h3><p>${step}</p>`;
  stepsBox.appendChild(div);
});
</script>

</body>
</html>
